name: Build and Release

on:
  push:
    tags:
      # Bare semver only. HoloUI's BuilderServer parses the tag with a strict
      # semver library — a leading "v" makes the plugin reject the release.
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arcane_jaspr is a path dependency at .deps/arcane_jaspr. Cross-org
      # checkout needs a PAT with read access to ArcaneArts/arcane_jaspr,
      # stored as the ARCANE_JASPR_TOKEN repository secret.
      - uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_jaspr
          token: ${{ secrets.ARCANE_JASPR_TOKEN }}
          path: .deps/arcane_jaspr

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build
        run: |
          dart pub get
          dart run jaspr_cli:jaspr build

      - name: Package builder_static.zip
        run: |
          cd build/jaspr
          rm -rf .dart_tool .DS_Store
          zip -qr ../../builder_static.zip . -x ".*"
          [ -f .nojekyll ] && zip -q ../../builder_static.zip .nojekyll
          cd ../..
          unzip -l builder_static.zip | head -8

      - name: Attach release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builder_static.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
