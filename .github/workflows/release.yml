name: Build and Release

on:
  push:
    tags:
      # Bare semver only. HoloUI's BuilderServer parses the tag with a strict
      # semver library — a leading "v" makes the plugin reject the release.
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_jaspr
          ref: b896cdc28008ef56439f10670a177943c7aba69e
          path: .deps/arcane_jaspr

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build
        run: |
          dart pub get
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            HUI_VERSION="$GITHUB_REF_NAME"
          else
            HUI_VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          fi
          dart run jaspr_cli:jaspr build \
            --dart-define=HUI_VERSION="$HUI_VERSION" \
            --dart-define=HUI_COMMIT="${GITHUB_SHA:0:7}"

      - name: Package builder_static.zip
        run: |
          cd build/jaspr
          rm -rf .dart_tool .DS_Store
          zip -qr ../../builder_static.zip . -x ".*"
          [ -f .nojekyll ] && zip -q ../../builder_static.zip .nojekyll
          cd ../..
          unzip -l builder_static.zip | head -8

      - name: Attach release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builder_static.zip

      - name: Explain why nothing was published
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          {
            echo "## No release published"
            echo "This run was not triggered by a tag, so the built builder_static.zip was NOT attached to any release."
            echo "To publish for servers: push a bare-semver tag (no 'v' prefix), e.g."
            echo '```'
            echo "git tag 3.1.0 && git push origin 3.1.0"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=No release published::Manual runs only build. Push a bare-semver tag (e.g. 3.1.0) to publish builder_static.zip for the plugin."
