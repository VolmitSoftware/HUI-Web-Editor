name: gloss_editor
description: "Visual web editor for Gloss menu configurations."
version: 4.0.0
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  web: ^1.1.1
  jaspr: ^0.23.1
  # Local checkout (or symlink) at .deps/arcane_jaspr — portable for CI.
  arcane_jaspr:
    path: .deps/arcane_jaspr
  arcane_jaspr_shadcn:
    path: .deps/arcane_jaspr/packages/arcane_jaspr_shadcn
  fast_log: ^1.0.7
  archive: ^4.0.2
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  build_daemon: 4.1.4 # pinned: jaspr_cli <-> build_runner protocol
  build_runner: 2.15.1
  build_web_compilers: ^4.4.18
  jaspr_builder: ^0.23.1
  jaspr_cli: ^0.23.2
  lints: ^6.1.0
  test: ^1.25.0

# arcane_jaspr_shadcn declares the hosted arcane_jaspr; the override keeps
# resolution on the local path checkout.
dependency_overrides:
  arcane_jaspr:
    path: .deps/arcane_jaspr

jaspr:
  mode: client

scripts:
  serve: jaspr serve
  build: jaspr build
  clean: jaspr clean
